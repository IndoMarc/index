<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Data</title>
    <style>
        body { 
            font-family: Cambria, Georgia, serif; 
            margin: 0; 
            background-color: #f8fafc; 
            color: #1e293b; 
            padding: 20px;
        }
        .container { 
            max-width: 850px; 
            margin: 0 auto; 
            background: #ffffff; 
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); 
            border: 1px solid #e2e8f0;
            position: relative;
            transition: filter 0.5s ease;
            filter: blur(8px);
            pointer-events: none;
        }
        .section { 
            display: none; 
        }
        .section.active { 
            display: block; 
        }
        textarea { 
            width: 100%; 
            height: 200px; 
            margin-top: 12px; 
            font-family: Cambria, Georgia, serif; 
            border: 1px solid #cbd5e1; 
            padding: 15px; 
            box-sizing: border-box; 
            background-color: #f1f5f9; 
            color: #0284c7;
            overflow: auto; 
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.5;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
        }
        .controls { 
            margin-bottom: 25px; 
            padding: 30px 20px; 
            border: 2px dashed #cbd5e1; 
            border-radius: 12px; 
            text-align: center; 
            background-color: #f8fafc; 
            transition: border-color 0.3s;
        }
        .controls:hover {
            border-color: #4f46e5;
        }
        input[type="file"] {
            display: block;
            margin: 0 auto 20px auto;
            color: #64748b;
            font-size: 14px;
            font-family: Cambria, Georgia, serif;
        }
        input[type="file"]::file-selector-button {
            background-color: #e2e8f0;
            color: #1e293b;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            margin-right: 15px;
            transition: background-color 0.2s;
            font-family: Cambria, Georgia, serif;
        }
        input[type="file"]::file-selector-button:hover {
            background-color: #cbd5e1;
        }
        button.action-btn { 
            background-color: #4f46e5; 
            color: white; 
            border: none; 
            padding: 12px 28px; 
            cursor: pointer; 
            border-radius: 8px; 
            font-weight: 600; 
            margin: 5px; 
            font-size: 15px;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
            font-family: Cambria, Georgia, serif;
        }
        button.action-btn:hover { 
            background-color: #4338ca; 
            transform: translateY(-1px);
        }
        button.action-btn:active {
            transform: translateY(1px);
        }
        .download-btn { 
            background-color: #10b981 !important; 
            margin-top: 20px !important;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2) !important;
        }
        .download-btn:hover { 
            background-color: #059669 !important; 
        }
        label { 
            font-weight: 500; 
            display: block; 
            margin-bottom: 8px; 
            margin-top: 20px; 
            color: #475569;
            font-size: 15px;
        }
        h2 { 
            text-align: center; 
            color: #0f172a; 
            margin-top: 0; 
            margin-bottom: 25px;
            font-size: 26px;
            letter-spacing: -0.5px;
        }
        .loading-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #e2e8f0;
            border-top: 5px solid #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loading-text {
            margin-top: 15px;
            color: #1e293b;
            font-weight: 500;
            font-size: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .auth-wrapper {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: 100%;
            max-width: 400px;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .auth-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        .auth-box h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #0f172a;
            font-size: 18px;
        }
        .auth-box input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #0f172a;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;
        }
        .auth-box input[type="password"]:focus {
            outline: none;
            border-color: #4f46e5;
        }
        .auth-box .error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div id="authWrapper" class="auth-wrapper">
    <div class="auth-box">
        <h3>Masukkan Password</h3>
        <input type="password" id="accessCode" placeholder="Ketik password disini ...">
        <button class="action-btn" onclick="checkCode()">Verifikasi</button>
        <div id="errorMsg" class="error-msg">Kode salah ! Silakan coba lagi ...</div>
    </div>
</div>

<div id="mainContainer" class="container">
    
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Memproses data , mohon tunggu ...</div>
    </div>

    <div id="sectionProduk" class="section active">
        <h2>Convert Data</h2>
        <div class="controls">
            <input type="file" id="csvFilesProduk" multiple accept=".csv, .txt">
            <button class="action-btn" onclick="convertProduk()">Proses Konversi</button>
        </div>
        <label>Hasil Konversi :</label>
        <textarea id="outputProduk" readonly></textarea>
        <div style="text-align: center;">
            <button id="dlProduk" class="action-btn download-btn" style="display:none;" onclick="downloadJSON('outputProduk')">Download JSON</button>
        </div>
    </div>

</div>

<script>
    function checkCode() {
        const codeInput = document.getElementById('accessCode').value;
        const errorMsg = document.getElementById('errorMsg');
        const mainContainer = document.getElementById('mainContainer');
        const authWrapper = document.getElementById('authWrapper');

        if (codeInput === "mharyrafli") {
            authWrapper.style.display = 'none';
            mainContainer.style.filter = 'none';
            mainContainer.style.pointerEvents = 'auto';
        } else {
            errorMsg.style.display = 'block';
            document.getElementById('accessCode').value = '';
        }
    }

    document.getElementById('accessCode').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            checkCode();
        }
    });

    function parseCSV(text) {
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
        if (lines.length === 0) return [];
        const headers = lines[0].split('|').map(h => h.trim());
        return lines.slice(1).map(line => {
            const values = line.split('|').map(v => v.trim());
            let obj = {};
            for (let i = 0; i < Math.min(headers.length, values.length); i++) {
                obj[headers[i]] = values[i];
            }
            return obj;
        });
    }

    function readFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => resolve(parseCSV(e.target.result));
            reader.onerror = reject;
            reader.readAsText(file);
        });
    }

    async function convertProduk() {
        const fileInput = document.getElementById('csvFilesProduk');
        const files = fileInput.files;

        if (files.length < 3) {
            alert("Pilih minimal 3 file (Barcode, Prodmast, Rak).");
            return;
        }

        let fBarcode, fProdmast, fRak;
        for (let f of files) {
            const name = f.name.toLowerCase();
            if (name.includes('barcode')) fBarcode = f;
            else if (name.includes('prodmast')) fProdmast = f;
            else if (name.includes('rak')) fRak = f;
        }

        if (!fBarcode || !fProdmast || !fRak) {
            alert("File tidak lengkap. Pastikan nama file mengandung kata 'barcode', 'prodmast', dan 'rak'.");
            return;
        }

        const loadingOverlay = document.getElementById('loadingOverlay');
        loadingOverlay.style.display = 'flex';

        setTimeout(async () => {
            try {
                const [barcodeData, prodmastData, rakData] = await Promise.all([
                    readFile(fBarcode), readFile(fProdmast), readFile(fRak)
                ]);

                let barcodeMap = {};
                barcodeData.forEach(row => {
                    const plu = row.PLU;
                    const barcd = row.BARCD;
                    if (plu && barcd) {
                        if (!barcodeMap[plu]) barcodeMap[plu] = [];
                        if (!barcodeMap[plu].includes(barcd)) barcodeMap[plu].push(barcd);
                    }
                });

                let combined = [];
                prodmastData.forEach(prod => {
                    const plu = prod.PLUMD;
                    if (!plu) return;
                    
                    const barcdList = barcodeMap[plu] || [];
                    const matchedRak = rakData.filter(r => r.PLUMD === plu);
                    const base = {
                        PLU: plu,
                        DESC2: prod.DESC2 || "",
                        PRICE: prod.PRICE || "",
                        BARCD: barcdList
                    };

                    if (matchedRak.length > 0) {
                        matchedRak.forEach(rak => {
                            combined.push({
                                ...base,
                                NAMA_RAK: rak.NAMA_RAK || null,
                                NOSHELF: rak.NOSHELF || null,
                                KIRIKANAN: rak.KIRIKANAN || null
                            });
                        });
                    } else {
                        combined.push({ ...base, NAMA_RAK: null, NOSHELF: null, KIRIKANAN: null });
                    }
                });

                document.getElementById('outputProduk').value = JSON.stringify(combined, null, 4);
                
                const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
                const today = new Date();
                const formattedDate = `${today.getDate()}_${months[today.getMonth()]}_${today.getFullYear()}`;
                const dlBtn = document.getElementById('dlProduk');
                dlBtn.textContent = `Download ${formattedDate}.json`;
                dlBtn.style.display = 'inline-block';
            } catch (e) {
                alert("Error memproses file produk.");
            } finally {
                loadingOverlay.style.display = 'none';
            }
        }, 300);
    }

    function downloadJSON(areaId) {
        const data = document.getElementById(areaId).value;
        if (!data) return;
        
        const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const today = new Date();
        const formattedDate = `${today.getDate()}_${months[today.getMonth()]}_${today.getFullYear()}`;
        
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${formattedDate}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
